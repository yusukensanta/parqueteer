# Static analysis for the Scala sources (run in CI as `sbt scalafixAll --check`).
rules = [DisableSyntax]

DisableSyntax {
  noReturns = true
  noXml = true
  noFinalize = true

  # Banned APIs that are common sources of vulnerabilities in file/CLI tools.
  regex = [
    {
      id = "noJavaDeserialization"
      pattern = "ObjectInputStream|readObject\\("
      message = "Java deserialization of untrusted data allows remote code execution."
    }
    {
      id = "noShellExecution"
      pattern = "\\.exec\\(|ProcessBuilder|sys\\.process"
      message = "Spawning processes from user-controlled input risks command injection."
    }
    {
      id = "noWeakHashes"
      pattern = "MessageDigest\\.getInstance\\(\"(MD5|SHA-?1)\"\\)"
      message = "MD5 and SHA-1 are broken for security purposes; use SHA-256 or better."
    }
    {
      id = "noTrustAllTls"
      pattern = "TrustAllCerts|setHostnameVerifier|ALLOW_ALL_HOSTNAME_VERIFIER|InsecureTrustManager"
      message = "Disabling TLS certificate or hostname verification enables MITM attacks."
    }
    {
      id = "noInsecureRandom"
      pattern = "new java\\.util\\.Random|new Random\\("
      message = "java.util.Random is predictable; use java.security.SecureRandom for security-sensitive values."
    }
  ]
}
