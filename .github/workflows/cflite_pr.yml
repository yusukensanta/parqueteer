# .github/workflows/cflite_pr.yml
name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.sbt'
      - 'project/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_pr.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Build fuzzers
        id: build
        # google/clusterfuzzlite/actions/build_fuzzers@v1
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1
        with:
          language: jvm
          sanitizer: address

      - name: Run fuzzers
        id: run
        # google/clusterfuzzlite/actions/run_fuzzers@v1
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 180
          mode: code-change
          sanitizer: address
          output-sarif: false
