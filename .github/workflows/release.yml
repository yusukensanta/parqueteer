name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v2.1.3, etc.)

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Setup Java
        # actions/setup-java@v5.2.0
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Show version info
        env:
          TAG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "Tag version: $TAG_VERSION"
          echo "Note: Using sbt-ci-release for automatic version management from git tags"

      - name: Setup sbt via Coursier
        run: |
          curl -fL https://github.com/coursier/coursier/releases/download/v2.1.24/cs-x86_64-pc-linux.gz | gzip -d > cs
          echo '1517a0b6c4b9608dc45da8f34bc8290707ed50104ee92662f57808d2c012be54  cs' | sha256sum -c
          chmod +x cs
          ./cs setup --yes --jvm 21
          echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH

      - name: Cache sbt dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}

      - name: Run tests
        run: sbt clean test

      - name: Install strip-nondeterminism
        run: |
          sudo apt-get update -qq
          # Pin to the version verified during development; fall back to whatever
          # Ubuntu's archive currently carries if that exact revision has aged out,
          # but always log which one actually ran so any release's exact tool
          # version is auditable from its workflow run.
          sudo apt-get install -y strip-nondeterminism=1.15.0-1build1 \
            || sudo apt-get install -y strip-nondeterminism
          strip-nondeterminism --version

      - name: Build reproducible universal distributions
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          # Tie all timestamps to the tagged commit, not build wall-clock, so
          # the archive is a pure function of the source rather than of when
          # CI happened to run.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"

          # Pass A and Pass B archives must live outside sbt's own `target/`
          # directory: each pass runs `sbt clean`, which wipes the whole
          # target tree, so a dist dir nested inside it gets deleted by the
          # second pass's clean before the two archives can be compared.
          DIST_A="${RUNNER_TEMP}/dist-a"
          DIST_B="${RUNNER_TEMP}/dist-b"

          build_dist() {
            local outdir="$1"
            local pkgdir="${outdir}/parqueteer-${VERSION}"

            sbt "set version := \"${VERSION}\"" clean Universal/stage

            # Only our own jar carries build-time timestamps in its zip
            # entries; third-party deps are immutable, version-pinned
            # Maven Central artifacts and are already byte-fixed.
            # Native-packager names our jar "<organization>.parqueteer-<version>.jar".
            strip-nondeterminism target/universal/stage/lib/*parqueteer-*.jar

            rm -rf "${pkgdir}"
            mkdir -p "${pkgdir}"
            cp -a target/universal/stage/. "${pkgdir}/"
            find "${pkgdir}" -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +

            (cd "${outdir}" && \
              tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
                  -cf - "parqueteer-${VERSION}" | gzip -n -9 > "parqueteer-${VERSION}.tgz")

            (cd "${outdir}" && \
              find "parqueteer-${VERSION}" | LC_ALL=C sort | zip -X -q "parqueteer-${VERSION}.zip" -@)
          }

          build_dist "${DIST_A}"
          build_dist "${DIST_B}"

          echo "Pass A:"; sha256sum "${DIST_A}/parqueteer-${VERSION}.tgz" "${DIST_A}/parqueteer-${VERSION}.zip"
          echo "Pass B:"; sha256sum "${DIST_B}/parqueteer-${VERSION}.tgz" "${DIST_B}/parqueteer-${VERSION}.zip"

          if ! diff <(sha256sum "${DIST_A}/parqueteer-${VERSION}.tgz" | cut -d' ' -f1) \
                    <(sha256sum "${DIST_B}/parqueteer-${VERSION}.tgz" | cut -d' ' -f1); then
            echo "::error::tgz is NOT reproducible between independent builds"
            exit 1
          fi
          if ! diff <(sha256sum "${DIST_A}/parqueteer-${VERSION}.zip" | cut -d' ' -f1) \
                    <(sha256sum "${DIST_B}/parqueteer-${VERSION}.zip" | cut -d' ' -f1); then
            echo "::error::zip is NOT reproducible between independent builds"
            exit 1
          fi
          echo "Reproducibility verified: both builds produced byte-identical archives."

          mkdir -p target/universal
          cp "${DIST_A}/parqueteer-${VERSION}.tgz" target/universal/
          cp "${DIST_A}/parqueteer-${VERSION}.zip" target/universal/

      - name: Generate checksums
        run: |
          cd target/universal
          sha256sum *.tgz *.zip > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      - name: Verify release artifacts exist
        run: ls -lh target/universal/

      - name: Upload build artifacts to workflow
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: parqueteer-${{ steps.version.outputs.VERSION }}
          path: |
            target/universal/*.tgz
            target/universal/*.zip
            target/universal/checksums.txt
          retention-days: 30

  # The only job that can write repository contents; it runs no build steps.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases

    steps:
      - name: Download release artifacts
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: parqueteer-${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub Release
        # softprops/action-gh-release@v3.0.0
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            dist/parqueteer-${{ needs.build.outputs.version }}.tgz
            dist/parqueteer-${{ needs.build.outputs.version }}.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-alpha') || contains(needs.build.outputs.version, '-beta') || contains(needs.build.outputs.version, '-rc') }}
          body: |
            ## Installation

            ### Homebrew (macOS/Linux)
            ```bash
            brew tap yusukensanta/parqueteer
            brew install parqueteer
            ```

            ### curl (macOS/Linux)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/yusukensanta/parqueteer/main/scripts/install.sh | bash
            ```

            ### Manual Installation

            #### Linux / macOS
            ```bash
            tar -xzf parqueteer-${{ needs.build.outputs.version }}.tgz
            cd parqueteer-${{ needs.build.outputs.version }}
            ./bin/parqueteer --version
            ```

            #### Windows
            ```powershell
            # Extract the zip file
            # Then run:
            cd parqueteer-${{ needs.build.outputs.version }}
            bin\parqueteer.bat --version
            ```

            ### Verify Download
            ```bash
            sha256sum -c checksums.txt
            ```

            For stronger verification independent of this release page (Sigstore-backed build provenance):
            ```bash
            gh attestation verify parqueteer-${{ needs.build.outputs.version }}.tgz --owner yusukensanta
            ```

            ## What's Changed
            <!-- Generated release notes will be appended below -->

  # Third-party tokens (Homebrew tap, portfolio dispatch) live here, with a
  # read-only GITHUB_TOKEN.
  publish:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download release artifacts
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: parqueteer-${{ needs.build.outputs.version }}
          path: dist

      - name: Update Homebrew Tap
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TGZ_SHA=$(grep "parqueteer-${VERSION}.tgz" dist/checksums.txt | cut -d' ' -f1)
          TGZ_URL="https://github.com/yusukensanta/parqueteer/releases/download/v${VERSION}/parqueteer-${VERSION}.tgz"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/yusukensanta/homebrew-parqueteer.git" /tmp/homebrew-tap

          cat > /tmp/homebrew-tap/Formula/parqueteer.rb << 'FORMULA'
          class Parqueteer < Formula
            desc "CLI tool for working with Parquet files - query, inspect, and convert with ease"
            homepage "https://github.com/yusukensanta/parqueteer"
            url "PLACEHOLDER_URL"
            sha256 "PLACEHOLDER_SHA"
            license "Apache-2.0"

            depends_on "openjdk@21"

            def install
              rm_r Dir["bin/*.bat"]
              libexec.install Dir["*"]
              (bin/"parqueteer").write_env_script libexec/"bin/parqueteer",
                JAVA_HOME: formula_opt_prefix("openjdk@21")
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/parqueteer --version 2>&1")
            end
          end
          FORMULA

          sed -i "s|PLACEHOLDER_URL|${TGZ_URL}|" /tmp/homebrew-tap/Formula/parqueteer.rb
          sed -i "s|PLACEHOLDER_SHA|${TGZ_SHA}|" /tmp/homebrew-tap/Formula/parqueteer.rb

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/parqueteer.rb
          git diff --cached --quiet || git commit -m "chore: update parqueteer to v${VERSION}"
          git push

      - name: Trigger portfolio sync
        continue-on-error: true
        env:
          PORTFOLIO_DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PORTFOLIO_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yusukensanta/yusukensanta.github.io/dispatches \
            -d "{\"event_type\":\"parqueteer-release\",\"client_payload\":{\"version\":\"v${VERSION}\"}}"

  # Isolated from build: this job holds no repo-push or third-party
  # tokens (Homebrew tap, portfolio dispatch), so the OIDC id-token it mints for
  # Sigstore signing can't be combined with those secrets in a single compromised
  # step.
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Download release artifacts
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: parqueteer-${{ needs.build.outputs.version }}
          path: dist

      - name: Generate build provenance attestation
        id: attest
        # actions/attest-build-provenance@v4.1.1
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.tgz
            dist/*.zip

      - name: Name the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p provenance
          cp "${BUNDLE}" "provenance/parqueteer-${VERSION}.intoto.jsonl"
          ls -l provenance

      - name: Upload provenance bundle
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: provenance-${{ needs.build.outputs.version }}
          path: provenance/*.intoto.jsonl
          retention-days: 30

  # Attaches the Sigstore provenance bundle to the GitHub Release so it can be
  # verified from the release page alone (and is recognised as signed). The only
  # job besides `release` with contents: write; it runs no build or third-party steps.
  attach-provenance:
    needs: [build, release, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download provenance bundle
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: provenance-${{ needs.build.outputs.version }}
          path: provenance

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release upload "v${VERSION}" provenance/*.intoto.jsonl --repo "${GITHUB_REPOSITORY}"
