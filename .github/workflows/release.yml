name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v2.1.3, etc.)

permissions:
  contents: write     # Required for creating releases
  attestations: write # Required to publish build provenance attestations
  id-token: write     # Required for Sigstore OIDC signing in attest-build-provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.2
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Setup Java
        # actions/setup-java@v5.2.0
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Show version info
        env:
          TAG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "Tag version: $TAG_VERSION"
          echo "Note: Using sbt-ci-release for automatic version management from git tags"

      - name: Setup sbt via Coursier
        run: |
          curl -fL https://github.com/coursier/coursier/releases/download/v2.1.24/cs-x86_64-pc-linux.gz | gzip -d > cs
          echo '1517a0b6c4b9608dc45da8f34bc8290707ed50104ee92662f57808d2c012be54  cs' | sha256sum -c
          chmod +x cs
          ./cs setup --yes --jvm 21
          echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH

      - name: Cache sbt dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}

      - name: Run tests
        run: sbt clean test

      - name: Install strip-nondeterminism
        run: sudo apt-get update -qq && sudo apt-get install -y strip-nondeterminism

      - name: Build reproducible universal distributions
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          # Tie all timestamps to the tagged commit, not build wall-clock, so
          # the archive is a pure function of the source rather than of when
          # CI happened to run.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"

          build_dist() {
            local outdir="$1"
            local pkgdir="${outdir}/parqueteer-${VERSION}"

            sbt "set version := \"${VERSION}\"" clean Universal/stage

            # Only our own jar carries build-time timestamps in its zip
            # entries; third-party deps are immutable, version-pinned
            # Maven Central artifacts and are already byte-fixed.
            # Native-packager names our jar "<organization>.parqueteer-<version>.jar".
            strip-nondeterminism target/universal/stage/lib/*parqueteer-*.jar

            rm -rf "${pkgdir}"
            mkdir -p "${pkgdir}"
            cp -a target/universal/stage/. "${pkgdir}/"
            find "${pkgdir}" -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +

            (cd "${outdir}" && \
              tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
                  -cf - "parqueteer-${VERSION}" | gzip -n -9 > "parqueteer-${VERSION}.tgz")

            (cd "${outdir}" && \
              find "parqueteer-${VERSION}" | LC_ALL=C sort | zip -X -q "parqueteer-${VERSION}.zip" -@)
          }

          build_dist target/dist-a
          build_dist target/dist-b

          echo "Pass A:"; sha256sum target/dist-a/parqueteer-${VERSION}.tgz target/dist-a/parqueteer-${VERSION}.zip
          echo "Pass B:"; sha256sum target/dist-b/parqueteer-${VERSION}.tgz target/dist-b/parqueteer-${VERSION}.zip

          if ! diff <(sha256sum target/dist-a/parqueteer-${VERSION}.tgz | cut -d' ' -f1) \
                    <(sha256sum target/dist-b/parqueteer-${VERSION}.tgz | cut -d' ' -f1); then
            echo "::error::tgz is NOT reproducible between independent builds"
            exit 1
          fi
          if ! diff <(sha256sum target/dist-a/parqueteer-${VERSION}.zip | cut -d' ' -f1) \
                    <(sha256sum target/dist-b/parqueteer-${VERSION}.zip | cut -d' ' -f1); then
            echo "::error::zip is NOT reproducible between independent builds"
            exit 1
          fi
          echo "Reproducibility verified: both builds produced byte-identical archives."

          mkdir -p target/universal
          cp target/dist-a/parqueteer-${VERSION}.tgz target/universal/
          cp target/dist-a/parqueteer-${VERSION}.zip target/universal/

      - name: Generate checksums
        run: |
          cd target/universal
          sha256sum *.tgz *.zip > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      - name: Generate build provenance attestation
        # actions/attest-build-provenance@v4.1.1
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            target/universal/*.tgz
            target/universal/*.zip

      - name: Prepare release artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "TGZ_FILE=target/universal/parqueteer-${VERSION}.tgz" >> $GITHUB_OUTPUT
          echo "ZIP_FILE=target/universal/parqueteer-${VERSION}.zip" >> $GITHUB_OUTPUT
          echo "CHECKSUMS=target/universal/checksums.txt" >> $GITHUB_OUTPUT

          # Verify files exist
          ls -lh target/universal/

      - name: Create GitHub Release
        # softprops/action-gh-release@v3.0.0
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          files: |
            ${{ steps.artifacts.outputs.TGZ_FILE }}
            ${{ steps.artifacts.outputs.ZIP_FILE }}
            ${{ steps.artifacts.outputs.CHECKSUMS }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-alpha') || contains(steps.version.outputs.VERSION, '-beta') || contains(steps.version.outputs.VERSION, '-rc') }}
          body: |
            ## Installation

            ### Homebrew (macOS/Linux)
            ```bash
            brew tap yusukensanta/parqueteer
            brew install parqueteer
            ```

            ### curl (macOS/Linux)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/yusukensanta/parqueteer/main/scripts/install.sh | bash
            ```

            ### Manual Installation

            #### Linux / macOS
            ```bash
            tar -xzf parqueteer-${{ steps.version.outputs.VERSION }}.tgz
            cd parqueteer-${{ steps.version.outputs.VERSION }}
            ./bin/parqueteer --version
            ```

            #### Windows
            ```powershell
            # Extract the zip file
            # Then run:
            cd parqueteer-${{ steps.version.outputs.VERSION }}
            bin\parqueteer.bat --version
            ```

            ### Verify Download
            ```bash
            sha256sum -c checksums.txt
            ```

            For stronger verification independent of this release page (Sigstore-backed build provenance):
            ```bash
            gh attestation verify parqueteer-${{ steps.version.outputs.VERSION }}.tgz --owner yusukensanta
            ```

            ## What's Changed
            <!-- Generated release notes will be appended below -->

      - name: Upload build artifacts to workflow
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parqueteer-${{ steps.version.outputs.VERSION }}
          path: |
            target/universal/*.tgz
            target/universal/*.zip
            target/universal/checksums.txt
          retention-days: 30

      - name: Update Homebrew Tap
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          TGZ_SHA=$(grep "parqueteer-${VERSION}.tgz" target/universal/checksums.txt | cut -d' ' -f1)
          TGZ_URL="https://github.com/yusukensanta/parqueteer/releases/download/v${VERSION}/parqueteer-${VERSION}.tgz"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/yusukensanta/homebrew-parqueteer.git" /tmp/homebrew-tap

          cat > /tmp/homebrew-tap/Formula/parqueteer.rb << 'FORMULA'
          class Parqueteer < Formula
            desc "CLI tool for working with Parquet files - query, inspect, and convert with ease"
            homepage "https://github.com/yusukensanta/parqueteer"
            url "PLACEHOLDER_URL"
            sha256 "PLACEHOLDER_SHA"
            version "PLACEHOLDER_VERSION"
            license "Apache-2.0"

            depends_on "openjdk@21"

            def install
              rm_r Dir["bin/*.bat"]
              libexec.install Dir["*"]
              (bin/"parqueteer").write_env_script libexec/"bin/parqueteer",
                JAVA_HOME: Formula["openjdk@21"].opt_prefix
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/parqueteer --version 2>&1")
            end
          end
          FORMULA

          sed -i "s|PLACEHOLDER_URL|${TGZ_URL}|" /tmp/homebrew-tap/Formula/parqueteer.rb
          sed -i "s|PLACEHOLDER_SHA|${TGZ_SHA}|" /tmp/homebrew-tap/Formula/parqueteer.rb
          sed -i "s|PLACEHOLDER_VERSION|${VERSION}|" /tmp/homebrew-tap/Formula/parqueteer.rb

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/parqueteer.rb
          git diff --cached --quiet || git commit -m "chore: update parqueteer to v${VERSION}"
          git push

      - name: Trigger portfolio sync
        continue-on-error: true
        env:
          PORTFOLIO_DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PORTFOLIO_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yusukensanta/yusukensanta.github.io/dispatches \
            -d "{\"event_type\":\"parqueteer-release\",\"client_payload\":{\"version\":\"v${VERSION}\"}}"
