# Scala Steward configuration. See https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

# One PR per release train; these artifacts must move in lockstep.
pullRequests.grouping = [
  { name = "jackson", "title" = "chore(deps): bump jackson", "filter" = [{"group" = "com.fasterxml.jackson.core"}] },
  { name = "opentelemetry", "title" = "chore(deps): bump opentelemetry", "filter" = [{"group" = "io.opentelemetry"}] }
]

# Hadoop major upgrades are reviewed manually. sbt 2 needs every build plugin
# to ship sbt 2 builds (sbt-bloop, sbt-scoverage, ...), so it is a planned
# migration rather than a routine update.
updates.ignore = [
  { groupId = "org.apache.hadoop", version = { prefix = "4." } },
  { groupId = "org.scala-sbt", artifactId = "sbt", version = { prefix = "2." } }
]

commits.message = "chore(deps): update ${artifactName} from ${currentVersion} to ${nextVersion}"
pullRequests.frequency = "7 days"
