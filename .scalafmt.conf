version = "3.11.5"
runner.dialect = scala3

maxColumn = 100

rewrite.rules = [SortImports, RedundantBraces, SortModifiers, PreferCurlyFors]

rewrite.scala3.convertToNewSyntax = true
# Indentation-based syntax everywhere: optional braces are removed from
# definitions and control structures (lambda argument blocks keep theirs), and
# indented regions of 30+ lines get an explicit end marker.
rewrite.scala3.removeOptionalBraces = yes
rewrite.scala3.insertEndMarkerMinLines = 30

align.preset = more
align.openParenCallSite = false
align.openParenDefnSite = false

newlines.topLevelStatementBlankLines = [
  { blanks { before = 1 } }
]

docstrings.style = Asterisk
docstrings.wrap = no
