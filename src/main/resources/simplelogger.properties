# Suppress noisy third-party library logs (NativeCodeLoader, CodecPool, etc.)
org.slf4j.simpleLogger.log.org.apache.hadoop=error
org.slf4j.simpleLogger.log.org.apache.parquet=error
org.slf4j.simpleLogger.log.com.google.cloud=error
org.slf4j.simpleLogger.log.com.amazonaws=error
org.slf4j.simpleLogger.log.software.amazon.awssdk=error
# The S3 analytics input stream prefetches blocks on background threads; when the
# reader closes the stream early, an in-flight prefetch logs "Socket closed" at
# ERROR with a stack trace even though the command succeeded. Real read failures
# still reach callers as exceptions.
org.slf4j.simpleLogger.log.software.amazon.s3.analyticsaccelerator=off
# azure-identity logs every credential it probes (including ERROR lines for tools that
# are not installed, such as azd) while DefaultAzureCredential walks its chain. The
# final failure still reaches the caller as an exception carrying the sign-in hint.
org.slf4j.simpleLogger.log.com.azure=error
org.slf4j.simpleLogger.log.com.azure.identity=off
